<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title description">
  <title id="title">Internet Monitor operational dark color palette</title>
  <desc id="description">The approved dark dashboard palette with background, surface, text, success, warning, failure, and unknown state colors.</desc>
  <rect width="960" height="340" fill="#121212"/>
  <text x="40" y="52" fill="#E0E0E0" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Internet Monitor — Operational Dark</text>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(40 90)">
      <rect width="200" height="90" rx="10" fill="#121212" stroke="#616161"/>
      <text x="16" y="38" fill="#E0E0E0">Background</text>
      <text x="16" y="66" fill="#A6A6A6">#121212</text>
    </g>
    <g transform="translate(260 90)">
      <rect width="200" height="90" rx="10" fill="#1E1E1E" stroke="#333333"/>
      <text x="16" y="38" fill="#E0E0E0">Surface</text>
      <text x="16" y="66" fill="#A6A6A6">#1E1E1E</text>
    </g>
    <g transform="translate(480 90)">
      <rect width="200" height="90" rx="10" fill="#E0E0E0"/>
      <text x="16" y="38" fill="#121212">Primary text</text>
      <text x="16" y="66" fill="#424242">#E0E0E0</text>
    </g>
    <g transform="translate(700 90)">
      <rect width="200" height="90" rx="10" fill="#424242" stroke="#616161"/>
      <text x="16" y="38" fill="#E0E0E0">Unknown</text>
      <text x="16" y="66" fill="#E0E0E0">#424242</text>
    </g>
    <g transform="translate(150 205)">
      <rect width="200" height="90" rx="10" fill="#1B5E20" stroke="#2E7D32"/>
      <text x="16" y="38" fill="#E8F5E9">Success</text>
      <text x="16" y="66" fill="#E8F5E9">#1B5E20</text>
    </g>
    <g transform="translate(380 205)">
      <rect width="200" height="90" rx="10" fill="#F57F17" stroke="#FBC02D"/>
      <text x="16" y="38" fill="#121212">Warning</text>
      <text x="16" y="66" fill="#121212">#F57F17</text>
    </g>
    <g transform="translate(610 205)">
      <rect width="200" height="90" rx="10" fill="#B71C1C" stroke="#D32F2F"/>
      <text x="16" y="38" fill="#FFEBEE">Failure</text>
      <text x="16" y="66" fill="#FFEBEE">#B71C1C</text>
    </g>
  </g>
</svg>
