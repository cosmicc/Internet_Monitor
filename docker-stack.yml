version: "3.8"

services:
  internet-monitor:
    image: ${IMAGE:-ghcr.io/cosmicc/internet-monitor:1.0}
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    ports:
      - target: 5005
        published: ${WEB_PORT:-5005}
        protocol: tcp
        mode: ingress
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      PING_HOST: "${PING_HOST:-1.1.1.1}"
      BACKUP_PING_HOST: "${BACKUP_PING_HOST:-8.8.8.8}"
      GATEWAY_1_IP: "${GATEWAY_1_IP:-}"
      GATEWAY_2_IP: "${GATEWAY_2_IP:-}"
      IMPORTANT_HOST_1: "${IMPORTANT_HOST_1:-}"
      IMPORTANT_HOST_2: "${IMPORTANT_HOST_2:-}"
      IMPORTANT_HOST_3: "${IMPORTANT_HOST_3:-}"
      DNS_HOST: "${DNS_HOST:-www.google.com}"
      DNS_SERVERS: "${DNS_SERVERS:-1.1.1.1,8.8.8.8}"
      DNS_RECORD_TYPE: "${DNS_RECORD_TYPE:-A}"
      DNS_TIMEOUT_SECONDS: "${DNS_TIMEOUT_SECONDS:-5}"
      DNS_SLOW_THRESHOLD_MS: "${DNS_SLOW_THRESHOLD_MS:-500}"
      PINGS: "${PINGS:-5}"
      PING_PERIOD_MS: "${PING_PERIOD_MS:-1000}"
      PING_TIMEOUT_MS: "${PING_TIMEOUT_MS:-1000}"
      INTERVAL: "${INTERVAL:-10}"
      TRIGGER: "${TRIGGER:-3}"
      HIGH_LATENCY_MS: "${HIGH_LATENCY_MS:-1000}"
      DNS_FAILURE_TRIGGER: "${DNS_FAILURE_TRIGGER:-3}"
      MAX_ALERTS_PER_HOUR: "${MAX_ALERTS_PER_HOUR:-5}"
      LOSS_ALERT_DELAY_SECONDS: "${LOSS_ALERT_DELAY_SECONDS:-300}"
      LATENCY_ALERT_DELAY_SECONDS: "${LATENCY_ALERT_DELAY_SECONDS:-300}"
      OUTAGE_ALERT_DELAY_SECONDS: "${OUTAGE_ALERT_DELAY_SECONDS:-300}"
      STATUS_PATH: "${STATUS_PATH:-/tmp/internet-monitor/status.json}"
      HISTORY_PATH: "${HISTORY_PATH:-/tmp/internet-monitor/history.json}"
      HISTORY_MAX_POINTS: "${HISTORY_MAX_POINTS:-720}"
      TIMEZONE: "${TIMEZONE:-America/Detroit}"
      WEB_TITLE: "${WEB_TITLE:-Internet Monitor}"
      WEB_WORKERS: "${WEB_WORKERS:-1}"
      WEB_THREADS: "${WEB_THREADS:-2}"
      WEB_ALLOWED_HOSTS: "${WEB_ALLOWED_HOSTS:-}"
      WEB_STATUS_MAX_AGE: "${WEB_STATUS_MAX_AGE:-300}"
      PUSHOVER_TOKEN: "${PUSHOVER_TOKEN:-}"
      PUSHOVER_TOKEN_FILE: "${PUSHOVER_TOKEN_FILE:-}"
      PUSHOVER_USER: "${PUSHOVER_USER:-}"
      PUSHOVER_USER_FILE: "${PUSHOVER_USER_FILE:-}"
      PUSHOVER_DEVICE: "${PUSHOVER_DEVICE:-}"
      PUSHOVER_PRIORITY: "${PUSHOVER_PRIORITY:-0}"
      PUSHOVER_TIMEOUT_SECONDS: "${PUSHOVER_TIMEOUT_SECONDS:-10}"
      PUSHOVER_RETRY_INITIAL_SECONDS: "${PUSHOVER_RETRY_INITIAL_SECONDS:-30}"
      PUSHOVER_RETRY_MAX_SECONDS: "${PUSHOVER_RETRY_MAX_SECONDS:-900}"
    healthcheck:
      test: ["CMD", "python", "-m", "internet_monitor.healthcheck"]
      interval: "${HEALTHCHECK_INTERVAL:-30s}"
      timeout: "${HEALTHCHECK_TIMEOUT:-5s}"
      start_period: "${HEALTHCHECK_START_PERIOD:-20s}"
      retries: ${HEALTHCHECK_RETRIES:-3}
    stop_grace_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 30s
