version: "3.8"

services:
  internet-monitor:
    image: ${INTERNET_MONITOR_IMAGE:-ghcr.io/cosmicc/internet-monitor:0.1.1}
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    ports:
      - target: ${INTERNET_MONITOR_WEB_PORT:-5005}
        published: ${INTERNET_MONITOR_WEB_HOST_PORT:-5005}
        protocol: tcp
        mode: ingress
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    environment:
      PYTHONUNBUFFERED: "1"
      INTERNET_MONITOR_LOG_LEVEL: "${INTERNET_MONITOR_LOG_LEVEL:-INFO}"
      INTERNET_MONITOR_PING_HOST: "${INTERNET_MONITOR_PING_HOST:-1.1.1.1}"
      INTERNET_MONITOR_BACKUP_PING_HOST: "${INTERNET_MONITOR_BACKUP_PING_HOST:-8.8.8.8}"
      INTERNET_MONITOR_GATEWAY_1_IP: "${INTERNET_MONITOR_GATEWAY_1_IP:-}"
      INTERNET_MONITOR_GATEWAY_2_IP: "${INTERNET_MONITOR_GATEWAY_2_IP:-}"
      INTERNET_MONITOR_DNS_HOST: "${INTERNET_MONITOR_DNS_HOST:-www.google.com}"
      INTERNET_MONITOR_DNS_SERVERS: "${INTERNET_MONITOR_DNS_SERVERS:-1.1.1.1,8.8.8.8}"
      INTERNET_MONITOR_DNS_RECORD_TYPE: "${INTERNET_MONITOR_DNS_RECORD_TYPE:-A}"
      INTERNET_MONITOR_DNS_TIMEOUT_SECONDS: "${INTERNET_MONITOR_DNS_TIMEOUT_SECONDS:-5}"
      INTERNET_MONITOR_DNS_SLOW_THRESHOLD_MS: "${INTERNET_MONITOR_DNS_SLOW_THRESHOLD_MS:-500}"
      INTERNET_MONITOR_PINGS: "${INTERNET_MONITOR_PINGS:-5}"
      INTERNET_MONITOR_PING_PERIOD_MS: "${INTERNET_MONITOR_PING_PERIOD_MS:-1000}"
      INTERNET_MONITOR_PING_TIMEOUT_MS: "${INTERNET_MONITOR_PING_TIMEOUT_MS:-1000}"
      INTERNET_MONITOR_INTERVAL: "${INTERNET_MONITOR_INTERVAL:-10}"
      INTERNET_MONITOR_TRIGGER: "${INTERNET_MONITOR_TRIGGER:-3}"
      INTERNET_MONITOR_HIGH_LATENCY_MS: "${INTERNET_MONITOR_HIGH_LATENCY_MS:-1000}"
      INTERNET_MONITOR_DNS_FAILURE_TRIGGER: "${INTERNET_MONITOR_DNS_FAILURE_TRIGGER:-3}"
      INTERNET_MONITOR_MAX_ALERTS_PER_HOUR: "${INTERNET_MONITOR_MAX_ALERTS_PER_HOUR:-5}"
      INTERNET_MONITOR_LOSS_ALERT_DELAY_SECONDS: "${INTERNET_MONITOR_LOSS_ALERT_DELAY_SECONDS:-300}"
      INTERNET_MONITOR_LATENCY_ALERT_DELAY_SECONDS: "${INTERNET_MONITOR_LATENCY_ALERT_DELAY_SECONDS:-300}"
      INTERNET_MONITOR_OUTAGE_ALERT_DELAY_SECONDS: "${INTERNET_MONITOR_OUTAGE_ALERT_DELAY_SECONDS:-300}"
      INTERNET_MONITOR_STATUS_PATH: "${INTERNET_MONITOR_STATUS_PATH:-/tmp/internet-monitor/status.json}"
      INTERNET_MONITOR_TIMEZONE: "${INTERNET_MONITOR_TIMEZONE:-America/Detroit}"
      INTERNET_MONITOR_WEB_TITLE: "${INTERNET_MONITOR_WEB_TITLE:-Internet Monitor}"
      INTERNET_MONITOR_WEB_PORT: "${INTERNET_MONITOR_WEB_PORT:-5005}"
      INTERNET_MONITOR_WEB_WORKERS: "${INTERNET_MONITOR_WEB_WORKERS:-1}"
      INTERNET_MONITOR_WEB_THREADS: "${INTERNET_MONITOR_WEB_THREADS:-2}"
      INTERNET_MONITOR_WEB_ALLOWED_HOSTS: "${INTERNET_MONITOR_WEB_ALLOWED_HOSTS:-}"
      INTERNET_MONITOR_WEB_STATUS_MAX_AGE: "${INTERNET_MONITOR_WEB_STATUS_MAX_AGE:-300}"
      INTERNET_MONITOR_PUSHOVER_TOKEN: "${INTERNET_MONITOR_PUSHOVER_TOKEN:-}"
      INTERNET_MONITOR_PUSHOVER_TOKEN_FILE: "${INTERNET_MONITOR_PUSHOVER_TOKEN_FILE:-}"
      INTERNET_MONITOR_PUSHOVER_USER: "${INTERNET_MONITOR_PUSHOVER_USER:-}"
      INTERNET_MONITOR_PUSHOVER_USER_FILE: "${INTERNET_MONITOR_PUSHOVER_USER_FILE:-}"
      INTERNET_MONITOR_PUSHOVER_DEVICE: "${INTERNET_MONITOR_PUSHOVER_DEVICE:-}"
      INTERNET_MONITOR_PUSHOVER_PRIORITY: "${INTERNET_MONITOR_PUSHOVER_PRIORITY:-0}"
      INTERNET_MONITOR_PUSHOVER_TIMEOUT_SECONDS: "${INTERNET_MONITOR_PUSHOVER_TIMEOUT_SECONDS:-10}"
      INTERNET_MONITOR_PUSHOVER_RETRY_INITIAL_SECONDS: "${INTERNET_MONITOR_PUSHOVER_RETRY_INITIAL_SECONDS:-30}"
      INTERNET_MONITOR_PUSHOVER_RETRY_MAX_SECONDS: "${INTERNET_MONITOR_PUSHOVER_RETRY_MAX_SECONDS:-900}"
    healthcheck:
      test: ["CMD", "python", "-m", "internet_monitor.healthcheck"]
      interval: "${INTERNET_MONITOR_HEALTHCHECK_INTERVAL:-30s}"
      timeout: "${INTERNET_MONITOR_HEALTHCHECK_TIMEOUT:-5s}"
      start_period: "${INTERNET_MONITOR_HEALTHCHECK_START_PERIOD:-20s}"
      retries: ${INTERNET_MONITOR_HEALTHCHECK_RETRIES:-3}
    stop_grace_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 30s
