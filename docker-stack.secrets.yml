version: "3.8"

# Optional overlay for externally managed Swarm secrets. Deploy this together
# with docker-stack.yml only after creating both secrets as documented in
# INSTALL.md.
services:
  internet-monitor:
    environment:
      INTERNET_MONITOR_PUSHOVER_TOKEN_FILE: /run/secrets/internet_monitor_pushover_token
      INTERNET_MONITOR_PUSHOVER_USER_FILE: /run/secrets/internet_monitor_pushover_user
    secrets:
      - source: internet_monitor_pushover_token
        target: internet_monitor_pushover_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: internet_monitor_pushover_user
        target: internet_monitor_pushover_user
        uid: "10001"
        gid: "10001"
        mode: 0400

secrets:
  internet_monitor_pushover_token:
    external: true
  internet_monitor_pushover_user:
    external: true
