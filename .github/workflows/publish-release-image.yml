name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify release tag matches the package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'from internet_monitor import __version__; print(__version__)')"
          test "${RELEASE_TAG#v}" = "${package_version}"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m pytest

      - name: Build Python package
        run: python -m build

      - name: Validate Docker Compose and Swarm definitions
        run: |
          docker compose config --quiet
          docker stack config --compose-file docker-stack.yml >/dev/null
          docker stack config --compose-file docker-stack.yml --compose-file docker-stack.secrets.yml >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cosmicc/internet-monitor
          tags: |
            type=raw,value=${{ steps.version.outputs.package_version }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and publish the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.package_version }}
          provenance: true
          sbom: true
