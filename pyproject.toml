[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-monitor"
version = "0.3"
description = "Docker-first Internet, latency, and DNS health monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "gunicorn>=23.0,<24.0",
    "pytz>=2024.1",
    "requests>=2.32,<3.0",
]

[tool.setuptools.package-data]
internet_monitor = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
include = ["internet_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
